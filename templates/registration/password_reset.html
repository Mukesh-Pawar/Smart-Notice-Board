{% extends 'base.html' %}{% block title %}Reset Password{% endblock %}{% block auth_content %}<div class="auth-page"><div class="auth-card"><h2>Reset your password</h2><p class="text-muted">Enter your account email. For local development, the reset email is printed in the terminal.</p><form method="post">{% csrf_token %}{{ form.email.errors }}{{ form.email }}<button class="btn btn-primary w-100 mt-3">Send Reset Link</button></form><p class="text-center mt-4"><a href="{% url 'accounts:login' %}">Back to Login</a></p></div></div>{% endblock %}
